name: Daily thumbnails

on:
  schedule:
    - cron: "15 8 * * 1-5"
  workflow_dispatch: {}

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fonts and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-poppins fonts-inter || true
          pip install -r requirements.txt

      - name: Generate today's images
        run: python generate.py

      - name: Upload images for preview (no email yet)
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails-preview
          path: output/*.jpg

      # - name: Email the images
